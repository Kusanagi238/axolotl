[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm>=8", "packaging==23.2"]
build-backend = "setuptools.build_meta"

[project]
name = "axolotl"
dynamic = ["version"]
# Declare runtime dependencies statically to avoid build-time pinning that
# can produce exact-version metadata and cause resolver conflicts.
dependencies = [
    "torch>=2.7.0,<3.0"
]
description = "LLM Trainer"
readme = "README.md"
requires-python = ">=3.10"
# license = "Apache-2.0"

[project.scripts]
axolotl = "axolotl.cli.main:main"

[project.urls]
Homepage = "https://axolotl.ai/"
Documentation = "https://docs.axolotl.ai/"
Repository = "https://github.com/axolotl-ai-cloud/axolotl.git"

[tool.setuptools_scm]
# Provide explicit setuptools_scm configuration to avoid ambiguous/None
# version inference and related warnings during sdist/metadata generation.
fallback_version = "0.0.0"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools]
# Declare packages explicitly to ensure MANIFEST.in patterns match the
# actual package layout and that sdist includes the package files.
packages = ["axolotl"]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "setuptools_axolotl_dynamic_dependencies.BuildPyCommand"
